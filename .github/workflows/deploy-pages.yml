name: Publish workshop website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate the website
        run: npm run build

      - name: Start the local renderer
        run: |
          npm run dev -- --port 4310 > /tmp/opensystem-preview.log 2>&1 &
          echo $! > /tmp/opensystem-preview.pid

      - name: Create the GitHub Pages files
        env:
          PAGES_PUBLIC_ORIGIN: https://hiroki-nakaba.github.io/opensystem
          STATIC_SOURCE_ORIGIN: http://localhost:4310
        run: npm run export:pages

      - name: Stop the local renderer
        if: always()
        run: |
          if [ -f /tmp/opensystem-preview.pid ]; then
            kill "$(cat /tmp/opensystem-preview.pid)" || true
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
